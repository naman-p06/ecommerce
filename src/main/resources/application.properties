spring.application.name=demo

# ?? Database ?????????????????????????????????????????????????????????
spring.datasource.url=jdbc:postgresql://localhost:5433/ecommerce
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=8081

# ?? JWT ???????????????????????????????????????????????????????????????
jwt.secret=${JWT_SECRET}
jwt.access-token.expiry-ms=3600000
jwt.refresh-token.expiry-ms=604800000
jwt.blacklist.cleanup-ms=1800000

# ?? Redis ?????????????????????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379
# If your Redis has a password (production), set it here:
# spring.data.redis.password=${REDIS_PASSWORD}

# Connection pool (Lettuce) ? keeps a pool of connections ready
# instead of opening a new TCP connection on every cache operation
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle=5
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# ?? Cache TTL (seconds) ???????????????????????????????????????????????
# These are fallback defaults; CacheConfig overrides per-cache TTL
cache.ttl.products=600
cache.ttl.product-by-id=900
cache.ttl.categories=1800
cache.ttl.search=300